spring:
  application:
    name: murisegames-api
  profiles:
    default: none
  datasource:
    url: ${DB_APP_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: murise
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
    url: ${DB_MIGRATION_URL}
    user: ${DB_MIGRATOR_USERNAME}
    password: ${DB_MIGRATOR_PASSWORD}
    default-schema: murise
    schemas: [murise]
    create-schemas: false
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
    locations: [classpath:db/migration]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: murise
        jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  devtools:
    restart:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    error:
      include-exception: false
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      whitelabel:
        enabled: false
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
app:
  auth:
    issuer: ${SUPABASE_URL}/auth/v1
    jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
    audience: authenticated
  cors:
    allowed-origins: ${CORS_ORIGINS}

name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-admin-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap disposable test database
        env:
          PGPASSWORD: test-admin-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE murise_app PASSWORD 'test-app-only'"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE murise_migrator PASSWORD 'test-migrator-only'"
      - name: Verify API and PostgreSQL migration
        env:
          RUN_DB_TESTS: 'true'
        run: bash gradlew test bootJar --no-daemon
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/murise-games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/murise-games/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
